name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # Explicit packages avoid traversing excluded vendored dependencies.
      - run: cargo fmt -p timeslay -p timeslay-core -p timeslay-dioxus -- --check

  rust-tests:
    name: Rust tests
    runs-on: ubuntu-24.04
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang cmake pkg-config \
            libpipewire-0.3-dev libspa-0.2-dev libxkbcommon-dev libwayland-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev \
            libasound2t64 libnss3 libgbm1
      - run: cargo test --workspace --locked

  script-tests:
    name: JavaScript and Python tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: slack/package-lock.json
      - run: npm ci
        working-directory: slack
      - run: npm test
        working-directory: slack
      - run: node tests/map_picker.mjs
      - run: python3 tests/android_release.py
      - run: python3 tests/migrate_timeslay.py
      - run: python3 packaging/test_install.py

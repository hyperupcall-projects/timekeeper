[package]
name = "time-slay"
version = "0.1.0"
edition = "2024"
description = "Slay the day with TimeSlay"
license = "MPL-2.0"

[dependencies]
anyhow = "1"
base64 = { version = "0.22.1", default-features = false, features = ["alloc", "std"] }
chrono = { version = "0.4.42", default-features = false, features = ["clock", "std", "serde"] }
directories = "6.0.0"
env_logger = "0.11.11"
getrandom = { version = "0.3.3", default-features = false, features = ["std"] }
iana-time-zone = "0.1"
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "x11",
    "crisp",
    "lazy",
    "tokio",
    "canvas",
    # Needed for the pointer-tracking widget that decides whether the details
    # card opens above or below the event that was clicked.
    "advanced",
    # Decodes the window icon, which is embedded in the binary.
    "image",
] }
log = "0.4.34"
linkify = "0.11"
notify = "8.2.0"
notify-rust = "4.18.0"
pipewire = { version = "0.10.1", optional = true }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rodio = { version = "0.22.2", default-features = false, features = ["symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_ignored = "0.1.14"
serde_json = "1.0.145"
sha2 = { version = "0.10.9", default-features = false }
toml = "1.1.6"
ureq = { version = "2.12.1", default-features = false, features = ["tls", "json"] }
urlencoding = "2.1.3"
# KGlobalAccel (KDE's global-shortcut broker) is spoken over D-Bus.
zbus = { version = "5", features = ["blocking-api"] }
rusqlite = { version = "0.41.0", features = ["bundled"] }
# The dock strip is a zwlr_layer_shell_v1 surface drawn in software. sctk is
# used without xkbcommon: the strip only needs the pointer.
smithay-client-toolkit = { version = "0.20", default-features = false, features = ["calloop"] }
tiny-skia = { version = "0.11", default-features = false, features = ["std"] }
cosmic-text = "0.15"

[features]
default = ["pipewire-audio", "wgpu"]

# Native PipeWire playback. Needs libpipewire-0.3-dev, libspa-0.2-dev and clang
# at build time. Without it the app still runs; the sound section of the alarm
# menu reports that audio is unavailable.
pipewire-audio = ["dep:pipewire"]

# The GPU renderer, on by default: text and clipping go through the GPU's
# glyph atlas and scissor rects, which keeps scrolling smooth on a busy day.
# Remove it from `default` to ship the software-only tiny-skia build instead
# (smaller binary, no GPU memory). iced still falls back to tiny-skia on its
# own when no adapter is available.
wgpu = ["iced/wgpu"]

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# The dock paints and shapes text on the CPU on every hover. Unoptimized (the
# installer ships the debug build) or size-optimized code makes that visibly
# sluggish, so the crates doing the work stay fully optimized in both profiles.
[profile.dev.package.tiny-skia]
opt-level = 3
[profile.dev.package.tiny-skia-path]
opt-level = 3
[profile.dev.package.cosmic-text]
opt-level = 3
[profile.dev.package.harfrust]
opt-level = 3
[profile.dev.package.swash]
opt-level = 3
[profile.dev.package.skrifa]
opt-level = 3
[profile.dev.package.read-fonts]
opt-level = 3
[profile.dev.package.fontdb]
opt-level = 3

[profile.release.package.tiny-skia]
opt-level = 3
[profile.release.package.tiny-skia-path]
opt-level = 3
[profile.release.package.cosmic-text]
opt-level = 3
[profile.release.package.harfrust]
opt-level = 3
[profile.release.package.swash]
opt-level = 3
[profile.release.package.skrifa]
opt-level = 3
[profile.release.package.read-fonts]
opt-level = 3
[profile.release.package.fontdb]
opt-level = 3

[target.'cfg(target_os = "android")'.dependencies]
# The OAuth module needs a real Android Intent launcher when the shared data
# layer is used by the mobile build.
webbrowser = "1"
jni = "0.21"
ndk-context = "0.1"

[dev-dependencies]
iced_test = "0.14"

# The iced application stays the root package. The Dioxus day view is a
# separate crate beside it rather than a replacement, so the two can be built
# and run independently.
[workspace]
members = ["core", "dioxus"]
default-members = ["."]
# The vendored iced_winit is patched in as a dependency, not built as a
# workspace member of its own.
exclude = ["vendor/iced_winit"]
resolver = "3"

# The screenshot renderer lives under `assets/` with the other non-source
# files, so it needs pointing at explicitly.
[[example]]
name = "screenshots"
path = "assets/examples/screenshots.rs"

# One-off move of the legacy time-block/task calendars into TimeSlay. Run in
# plan mode, then again with --apply.
[[example]]
name = "migrate_calendar"
path = "assets/examples/migrate_calendar.rs"

# One-off move of the Keep "Habits & Rituals" notes into Calendar habits. Run
# in plan mode, then again with --apply.
[[example]]
name = "migrate_keep_habits"
path = "assets/examples/migrate_keep_habits.rs"

# Keep synchronous native resizes in sync with the viewport and render surface.
[patch.crates-io]
iced_winit = { path = "vendor/iced_winit" }
